name: Publish MirageVM image

on:
  push:
    branches: ["main", "master"]
    paths:
      - "miragevm/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-miragevm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MirageVM
        uses: docker/build-push-action@v6
        with:
          context: ./miragevm
          file: ./miragevm/Dockerfile
          push: true
          # The domestic ghcr.nju.edu.cn proxy correctly resolves OCI image
          # indexes with an explicit platform, as used by the other challenges.
          platforms: linux/amd64
          tags: |
            ghcr.io/n0va6/pwn-miragevm:latest
            ghcr.io/n0va6/pwn-miragevm:sha-${{ github.sha }}
          # Keep the provenance attestation: Buildx then publishes an OCI image
          # index, matching the format that ghcr.nju.edu.cn serves correctly.
          provenance: mode=min
          sbom: false
