name: Publish MirageVM image

on:
  push:
    branches: ["main", "master"]
    paths:
      - "miragevm/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-miragevm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MirageVM
        uses: docker/build-push-action@v6
        with:
          context: ./miragevm
          file: ./miragevm/Dockerfile
          push: true
          tags: ghcr.io/n0va6/pwn-miragevm:latest
          provenance: false
          sbom: false
