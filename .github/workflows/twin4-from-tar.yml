name: Publish TWIN V4 GUID-flag image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twin4-beacon-v4-keylin-linux-amd64.docker-load.tar'
      - '.github/workflows/twin4-from-tar.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Verify exact organizer image archive
        shell: bash
        run: |
          set -euo pipefail
          echo "0085cd572262945b7e2d3aa43774d91052d83ad01ac5ee8a2011341f9147ee84  twin4-beacon-v4-keylin-linux-amd64.docker-load.tar" | sha256sum -c -

      - name: Import prepared Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker load -i twin4-beacon-v4-keylin-linux-amd64.docker-load.tar
          docker image inspect iscc2026/twin4-beacon:v4-beacon-3 --format '{{.Os}}/{{.Architecture}} {{.Config.User}} {{json .Config.Entrypoint}}'
          test "$(docker image inspect iscc2026/twin4-beacon:v4-beacon-3 --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"

      - name: Verify start and TCP greeting using disposable flag
        shell: bash
        env:
          TEST_FLAG: 'ISCC{00000000-0000-4000-8000-000000000000}'
        run: |
          set -euo pipefail
          docker run -d --name twin4-ci \
            -p 127.0.0.1:31337:31337 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 \
            -e GZCTF_FLAG="$TEST_FLAG" \
            iscc2026/twin4-beacon:v4-beacon-3
          trap 'docker logs twin4-ci || true; docker rm -f twin4-ci >/dev/null 2>&1 || true' EXIT
          python3 - <<'PYCODE'
          import socket, time
          for i in range(30):
              try:
                  with socket.create_connection(('127.0.0.1',31337), timeout=2) as s:
                      b = b''
                      while len(b) < 24:
                          c = s.recv(24-len(b))
                          if not c:
                              break
                          b += c
                      if len(b)==24 and b.startswith(b'TWINLED4'):
                          print('PASS: Docker startup and TWINLED4 TCP greeting')
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('FAIL: TWIN V4 greeting unavailable')
          PYCODE

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GUID-compatible image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/pwn-twin4"
          docker tag iscc2026/twin4-beacon:v4-beacon-3 "${image}:v4-beacon-3"
          docker push "${image}:v4-beacon-3"
          echo "Published ${image}:v4-beacon-3" >> "$GITHUB_STEP_SUMMARY"
